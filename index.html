<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5C3A2B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ChácaraLD - Espaço Premium para Eventos</title>
    <meta name="description" content="Espaço exclusivo para casamentos, festas e eventos corporativos em meio à natureza com estrutura completa e alto padrão." />
    <meta name="author" content="ChácaraLD" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- Preload custom font -->
    <link rel="preload" href="/1769.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/KenokyLight-3zezL.ttf" as="font" type="font/ttf" crossorigin>
    
    <!-- Preload critical images -->
    <link rel="preload" href="/logo2.webp" as="image">
    <link rel="preload" href="/background.webp" as="image">

    <meta property="og:title" content="ChácaraLD - Espaço Premium para Eventos" />
    <meta property="og:description" content="Espaço exclusivo para casamentos, festas e eventos corporativos em meio à natureza com estrutura completa e alto padrão." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo2.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@chacarald" />
    <meta name="twitter:image" content="/logo2.webp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
