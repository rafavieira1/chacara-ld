<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5C3A2B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ChácaraLD - Espaço Premium para Eventos</title>
    <meta name="description" content="Espaço exclusivo para casamentos, festas e eventos corporativos em meio à natureza com estrutura completa e alto padrão." />
    <meta name="author" content="ChácaraLD" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload Google Fonts with display=swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=Great+Vibes&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"></noscript>
    
    <!-- Preload custom fonts -->
    <link rel="preload" href="/1769.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/KenokyLight-3zezL.ttf" as="font" type="font/ttf" crossorigin>
    
    <!-- Preload critical images with high priority -->
    <link rel="preload" href="/logo2.png" as="image" fetchpriority="high">
    <link rel="preload" href="/background.webp" as="image" fetchpriority="high">

    <!-- Critical CSS inline to avoid render-blocking -->
    <style>
      /* Critical CSS for above-the-fold content - Mobile optimized */
      :root {
        --background: 25 15% 96%;
        --foreground: 25 15% 15%;
        --primary: 25 35% 40%;
        --primary-foreground: 25 15% 96%;
        --radius: 0.75rem;
        --brand: 27 96% 61%;
        --brand-foreground: 31 97% 72%;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.6;
        overflow-x: hidden;
        /* Prevent layout shifts */
        min-height: 100vh;
        /* Optimize for mobile */
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        /* Prevent reflow */
        contain: layout style paint;
      }
      
      /* Critical font definitions */
      @font-face {
        font-family: 'Font1769';
        src: url('/1769.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      
      @font-face {
        font-family: 'Kanoky';
        src: url('/KenokyLight-3zezL.ttf') format('truetype');
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      
      /* Critical utility classes */
      .font-1769 { font-family: 'Font1769', serif; }
      .font-kanoky { font-family: 'Kanoky', sans-serif; }
      
      /* Mobile-optimized image styles */
      img {
        max-width: 100%;
        height: auto;
        /* Prevent layout shifts */
        aspect-ratio: attr(width) / attr(height);
      }
      
      /* Optimize for mobile performance */
      @media (max-width: 768px) {
        /* Reduce animations on mobile */
        * {
          animation-duration: 0.1s !important;
          transition-duration: 0.1s !important;
        }
        
        /* Optimize text rendering */
        body {
          font-size: 16px; /* Prevent zoom on iOS */
        }
      }
    </style>

    <meta property="og:title" content="ChácaraLD - Espaço Premium para Eventos" />
    <meta property="og:description" content="Espaço exclusivo para casamentos, festas e eventos corporativos em meio à natureza com estrutura completa e alto padrão." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo2.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@chacarald" />
    <meta name="twitter:image" content="/logo2.webp" />
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Defer non-critical CSS -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
